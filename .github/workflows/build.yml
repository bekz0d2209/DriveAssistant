name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Restore signing key
        run: base64 -d keystore.b64 > keystore.jks

      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DriveAssistant.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Drive Assistant (сборка ${{ github.run_number }})
          files: DriveAssistant.apk

      - name: Save log on failure
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout -B build-log
          tail -c 60000 build.log > failed-build.log || echo "no log" > failed-build.log
          git add -f failed-build.log
          git commit -m "Build log ${{ github.run_number }}"
          git push -f origin build-log
